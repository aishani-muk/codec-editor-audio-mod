# Track C — MusicGen audio-encoder (frozen, layer-4 outputs) + 6-layer
# GPT-2 decoder head trained from scratch on EnCodec tokens.
inherits: base_jamendo.yaml

track:
  name: "track_c"
  description: >
    Frozen MusicGen EnCodec + first 4 transformer layers produce 1024-d
    features at 25 Hz (pooled from 50 Hz). Linear→512 projection, concat
    with u-embed + tune-type-embed + rhythm-fingerprint-embed, feed into
    a 6-layer GPT-2 decoder that predicts edited EnCodec tokens. Decode
    via MusicGen's frozen EnCodec decoder. Same auxiliary loss stack as
    Track A (PCD-KL + anti-collapse + rhythm-preserve + consistency +
    MERT perceptual).

hybrid:
  musicgen_id: "facebook/musicgen-small"
  freeze_layers_below: 4          # freeze first 4 decoder layers
  feature_hz: 25                   # pool from 50 → 25 Hz
  proj_dim: 512
  rhythm_embed_dim: 32

training:
  max_steps: 20000
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  warmup_steps: 500
  save_steps: 2500
  eval_steps: 1000
  # Same loss weights as Track A; consistency is slightly higher because
  # Track C's encoder is much more powerful (more room to break without
  # the equivariance anchor).
  pcd_kl_weight: 0.10
  anti_collapse_weight: 0.05
  rhythm_preserve_weight: 0.08
  consistency_weight: 0.05
  mert_perceptual_weight: 0.05

checkpoints:
  dir: "checkpoints"
  name: "celtic_track_c"
