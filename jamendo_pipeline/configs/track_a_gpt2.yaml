# Track A — GPT-2 codec editor with the full Celtic loss stack.
# Inherits everything from base_jamendo.yaml; only knobs that differ go here.
inherits: base_jamendo.yaml

track:
  name: "track_a"
  description: >
    GPT-2 codec-to-codec editor, warm-started from the existing Saraga
    pretrain_speech75 checkpoint. Trained 80% Celtic + 20% Saraga with
    the SOTA loss stack: PCD-KL + anti-collapse + rhythm-preserve + MERT
    perceptual + consistency, under EMA + curriculum-u + scheduled sampling.
  warm_start:
    path: "checkpoints/pretrain_speech75/pretrain.pt"
    ignore_missing_keys: ["raga_embed.*"]   # new label head for tune types

training:
  max_steps: 25000
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  warmup_steps: 500
  save_steps: 2500
  eval_steps: 1000
  rhythm_preserve_weight: 0.08
  # Track A specifically: enable MERT perceptual on a schedule, leave it
  # at a low weight because the gradient flow is truncated (diagnostic + gate).
  mert_perceptual_weight: 0.05
  mert_perceptual_every_n_steps: 4

checkpoints:
  dir: "checkpoints"
  name: "celtic_track_a"
