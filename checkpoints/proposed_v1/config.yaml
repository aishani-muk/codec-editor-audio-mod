bpe:
  enabled: false
  max_token_codebook_ngrams: 4
  model_dir: data/tokens/bpe_model
  vocab_size: 8192
checkpoints:
  dir: checkpoints
  save_best_metric: val_loss
  save_best_mode: min
data:
  clips_per_track: 8
  deam_dir: data/deam
  held_out_tracks:
  - Raag_Yaman__Raag_Yaman
  max_clip_sec: 10.0
  pairs_dir: data/paired_edits
  saraga_dir: data/saraga_kalyan_thaat
  select_mode: informative
  test_split: 0.05
  tokens_dir: data/tokens
  tokens_subdir: wavtok_speech75
  train_split: 0.85
  val_split: 0.1
  yaman_features_dir: data/raga_features
description: speech-75token + input-aligned residual editor + raga-label
editor:
  architecture: gpt2
  crossfade_sec: 0.1
  d_ff: 2048
  d_model: 512
  dropout: 0.1
  hop_sec: 0.5
  max_seq_len: 1536
  n_heads: 8
  n_layers: 6
  train_crop_tokens: 150
  use_input_residual: true
  use_raga_label: true
  window_sec: 2.0
evaluation:
  crepe_hop_ms: 10
  deam_neutral_target:
    arousal: 3.0
    valence: 5.0
  jsd_bins: 1200
  tonic_drift_threshold_cents: 15.0
run_name: proposed_v2
sample_rate: 24000
seed: 42
stress_proxy:
  control_gain: 1.0
  control_offset: 0.0
  default_profile: ramp
  default_u: 0.6
  embed_dim: 64
  mode: synthetic
  n_buckets: 64
  onset_sec: 5.0
  ramp_sec: 1.0
  wesad:
    hop_sec: 2.0
    model_path: models/stress_model/stress_classifier.pkl
    window_sec: 4.0
training:
  aux_jsd_weight: 0.05
  batch_size: 16
  dataloader_num_workers: 4
  early_stop_patience: 5
  eval_steps: 1000
  fp16: true
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  max_steps: 50000
  save_steps: 2000
  warmup_steps: 500
  weight_decay: 0.01
wavtokenizer:
  codebook_size: 4096
  config_path: null
  model_name: novateur/WavTokenizer-large-speech-75token
  n_codebooks: 1
  tokens_per_sec: 75
