# Ablation: swap the speech-75 tokenizer back to unify-40 (the
# pre-redesign default). Everything else matches proposed.yaml.

_base_: "../proposed.yaml"

run_name: "abl_unify40"
description: "Unify-40 tokenizer instead of speech-75 (tokenizer ablation)"

wavtokenizer:
  model_name: "novateur/WavTokenizer-large-unify-40token"
  tokens_per_sec: 40

data:
  tokens_subdir: "wavtok"           # the already-existing unify-40 codes

editor:
  max_seq_len: 2048                 # 40 tok/s * 30s = 1200 per side fits in 2048 concat
