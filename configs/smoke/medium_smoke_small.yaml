# Medium-smoke using the small model. 2000 steps, batch_size 8 (we can
# afford more since the model is smaller), LR slightly up.
_base_: "../proposed_small.yaml"

run_name: "medium_smoke_small"
description: "2k-step smoke on the small model after pretraining"

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 2000
  eval_steps: 200
  save_steps: 1000
  early_stop_patience: 99
  fp16: true
  dataloader_num_workers: 2
  aux_jsd_weight: 0.05
