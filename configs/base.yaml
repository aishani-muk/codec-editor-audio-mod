# ── Shared configuration ──
seed: 42
sample_rate: 24000

# WavTokenizer
wavtokenizer:
  model_name: "novateur/WavTokenizer-large-speech-75token"
  config_path: null  # auto-resolved from HF
  tokens_per_sec: 75
  codebook_size: 4096
  n_codebooks: 1

# codec-BPE (disabled: 5% compression on music codes doesn't justify complexity)
bpe:
  enabled: false
  vocab_size: 8192
  max_token_codebook_ngrams: 4
  model_dir: "data/tokens/bpe_model"

# Stress proxy
stress_proxy:
  mode: "synthetic"        # "synthetic" or "wesad"
  onset_sec: 5.0           # stress activates at t=5s into each clip
  ramp_sec: 1.0            # linear ramp-up duration
  default_u: 0.6           # default edit intensity
  default_profile: "ramp"  # "ramp", "pulse", "episodic"
  embed_dim: 64            # stress embedding dimension
  n_buckets: 64            # discretisation bins for embedding
  control_gain: 1.0        # a in u(t) = clip(a*s + b, 0, 1)
  control_offset: 0.0      # b
  wesad:
    model_path: "models/stress_model/stress_classifier.pkl"
    window_sec: 4.0
    hop_sec: 2.0

# Streaming editor
editor:
  architecture: "gpt2"
  n_layers: 6
  n_heads: 8
  d_model: 512
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 1536          # input + target concat; 75 tok/s * 10s = 750 per side
  window_sec: 2.0
  hop_sec: 0.5
  crossfade_sec: 0.1
  use_input_residual: true   # input-aligned residual editor (May-2026 redesign)
  use_raga_label: true       # per-clip raga embedding
  train_crop_tokens: 150     # window_sec(2.0) * tokens_per_sec(75) = 150
                             #   aligns training distribution with streaming
                             #   inference; set to null / 0 for full-clip.

# Training
training:
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500                     # linear warmup -> cosine decay
  max_steps: 50000                      # optimizer steps (not micro-batches)
  eval_steps: 1000
  save_steps: 2000
  early_stop_patience: 5                # eval intervals w/o val-loss improvement -> stop
  fp16: true
  dataloader_num_workers: 4
  aux_jsd_weight: 0.05                  # auxiliary token-histogram JSD
                                        #   (pitch-class distribution proxy);
                                        #   0 disables.

# Data
data:
  saraga_dir: "data/saraga_kalyan_thaat"
  yaman_features_dir: "data/raga_features"
  deam_dir: "data/deam"
  pairs_dir: "data/paired_edits"
  tokens_dir: "data/tokens"
  tokens_subdir: "wavtok_speech75"   # matches the speech-75 re-encode
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  max_clip_sec: 10.0                 # 10 s informative-window clips
  # Informative-window selection (used by data/prepare_pairs.py)
  select_mode: "informative"         # "informative" | "uniform"
  clips_per_track: 8                 # top-K windows per source recording
  held_out_tracks:
    - "Raag_Yaman__Raag_Yaman"

# Evaluation
evaluation:
  tonic_drift_threshold_cents: 15.0
  jsd_bins: 1200           # 1-cent resolution for octave-folded histograms
  crepe_hop_ms: 10
  deam_neutral_target:
    valence: 5.0           # DEAM scale 1-9, neutral ~5
    arousal: 3.0           # lower arousal target

# Checkpointing
checkpoints:
  dir: "checkpoints"
  save_best_metric: "val_loss"         # what train.py actually tracks
  save_best_mode: "min"
