# Raw-codec language-model pretraining config.
# Trains CodecEditor as an unconditional next-token predictor on the
# TARGET-side speech-75 tokens (no paired-edit conditioning, no raga,
# no stress). Gives the embedding table + lower transformer layers
# a proper codec prior before we fine-tune on the (input, target, u)
# editing task.
_base_: "proposed_small.yaml"

run_name: "pretrain_codec_lm"
description: "Unconditional next-token LM on target codec tokens"

training:
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 6.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 4000
  eval_steps: 500
  save_steps: 2000
  early_stop_patience: 99
  fp16: true
  dataloader_num_workers: 2
  aux_jsd_weight: 0.0
