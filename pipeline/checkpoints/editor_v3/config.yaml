bpe:
  enabled: false
  max_token_codebook_ngrams: 4
  model_dir: data/tokens/bpe_model
  vocab_size: 8192
checkpoints:
  dir: checkpoints
  save_best_metric: val_loss
  save_best_mode: min
data:
  clips_per_track: 8
  deam_dir: data/deam
  held_out_tracks:
  - Raag_Yaman__Raag_Yaman
  - Raag_Todi__Raag_Todi
  - Raga_Shree___Khayal
  manifest_filename: manifest.jsonl
  max_clip_sec: 10.0
  pairs_dir: data/paired_natural
  saraga_dir: data/saraga_all_ragas
  select_mode: informative
  synthetic:
    manifest_filename: manifest_va_filtered.jsonl
    mix_weight: 0.2
    pairs_dir: data/paired_edits_v2
    tokens_dir: data/tokens_v2
    tokens_subdir: wavtok_speech75
  test_split: 0.05
  tokens_dir: data/tokens_natural
  tokens_subdir: wavtok_speech75
  train_split: 0.85
  val_split: 0.1
  yaman_features_dir: data/raga_features
description: natural+synthetic pairs, speech-75, L_pcd + L_anti_collapse
editor:
  architecture: gpt2
  crossfade_sec: 0.1
  d_ff: 2048
  d_model: 512
  dropout: 0.1
  hop_sec: 0.5
  max_seq_len: 1536
  n_heads: 8
  n_layers: 6
  train_crop_tokens: 150
  use_input_residual: true
  use_raga_label: true
  window_sec: 2.0
evaluation:
  crepe_hop_ms: 10
  deam_neutral_target:
    arousal: 3.0
    valence: 5.0
  jsd_bins: 1200
  tonic_drift_threshold_cents: 15.0
pretrain_ckpt: checkpoints/pretrain_speech75/pretrain.pt
run_name: editor_v3
sample_rate: 24000
seed: 42
stress_proxy:
  control_gain: 1.0
  control_offset: 0.0
  default_profile: ramp
  default_u: 0.6
  embed_dim: 64
  mode: synthetic
  n_buckets: 64
  onset_sec: 5.0
  ramp_sec: 1.0
  wesad:
    hop_sec: 2.0
    model_path: models/stress_model/stress_classifier.pkl
    window_sec: 4.0
training:
  anti_collapse_threshold: 0.5
  anti_collapse_warmup_steps: 2000
  anti_collapse_weight: 0.05
  aux_jsd_weight: 0.0
  aux_pcd_weight: 0.1
  batch_size: 16
  cfg_drop_prob: 0.1
  dataloader_num_workers: 0
  early_stop_patience: 8
  eval_steps: 1000
  fp16: true
  gradient_accumulation_steps: 2
  identity_mix_rate: 0.1
  learning_rate: 0.0003
  max_steps: 50000
  monotonic_u_margin: 0.05
  monotonic_u_weight: 0.1
  save_steps: 2000
  val_entropy_gate: 0.2
  warmup_steps: 500
  weight_decay: 0.01
wavtokenizer:
  codebook_size: 4096
  config_path: null
  model_name: novateur/WavTokenizer-large-speech-75token
  n_codebooks: 1
  tokens_per_sec: 75
