# Ablation: turn BPE back on over the speech-75 tokens. The BPE model
# has to be retrained on the new codes -- use `scripts/slurm_tokenize.sh`
# with tokens_subdir swapped to speech-75 first.

_base_: "proposed.yaml"

run_name: "abl_with_bpe"
description: "BPE on top of speech-75 tokens"

bpe:
  enabled: true

data:
  tokens_subdir: "bpe_speech75"
